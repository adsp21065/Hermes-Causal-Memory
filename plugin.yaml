name: temporal-memory
version: 0.1.0
manifest_version: 2
api_version: 1
description: Learns temporal and causal constraints from Hermes task traces.
license: MIT
tags: [memory, temporal, experience, world-model]
provides_tools:
  - temporal_check
  - temporal_query
  - temporal_record_event
provides_hooks:
  - post_tool_call
  - on_session_end
  - pre_llm_call
config_schema:
  auto_extract:
    type: bool
    default: false
    description: Extract temporal rules after every completed session; incurs an LLM call.
  max_trace_events:
    type: int
    default: 80
    description: Maximum tool and explicit events retained per task trace.
