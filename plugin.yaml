name: causal-memory
version: 0.2.0
manifest_version: 2
api_version: 1
description: Learns evidence-backed causal candidates from Hermes task observations.
license: MIT
tags: [memory, causal, experience, world-model]
provides_tools:
  - causal_check
  - causal_query
  - causal_record_observation
provides_hooks:
  - post_tool_call
  - on_session_end
  - pre_llm_call
config_schema:
  auto_extract:
    type: bool
    default: false
    description: Extract observations after every completed session; incurs an LLM call.
  max_trace_events:
    type: int
    default: 80
    description: Maximum tool and explicit events retained per task trace.
